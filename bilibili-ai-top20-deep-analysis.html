function RadarPlaceholder({label,scores}){
  const size=120;
  const cx=size/2,cy=size/2,r=size/2-16;
  const axes=scores.map((_,i)=>({angle:(Math.PI*2*i/scores.length)-Math.PI/2}));
  const gridRings=[0.33,0.66,1];
  return(
    <div style={{textAlign:'center'}}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        {gridRings.map((ring,ri)=>(
          <polygon key={ri} points={axes.map(a=>`${cx+r*ring*Math.cos(a.angle)},${cy+r*ring*Math.sin(a.angle)}`).join(' ')} fill="none" stroke="#1a1a25" strokeWidth="1"/>
        ))}
        {axes.map((a,i)=>(
          <line key={i} x1={cx} y1={cy} x2={cx+r*Math.cos(a.angle)} y2={cy+r*Math.sin(a.angle)} stroke="#1a1a25" strokeWidth="1"/>
        ))}
        <polygon points={scores.map((s,i)=>`${cx+r*s*Math.cos(axes[i].angle)},${cy+r*s*Math.sin(axes[i].angle)}`).join(' ')} fill="rgba(0,212,170,0.15)" stroke="#00d4aa" strokeWidth="1.5"/>
        {scores.map((s,i)=>(
          <circle key={i} cx={cx+r*s*Math.cos(axes[i].angle)} cy={cy+r*s*Math.sin(axes[i].angle)} r="3" fill="#00d4aa"/>
        ))}
      </svg>
      <div style={{fontSize:11,color:'#888',marginTop:4}}>{label}</div>
    </div>
  );
}

                {tier:"成长型（30万以下）",range:"年入5-30万",count:BLOGGERS.filter(b=>b.fans<30).length,color:"#6c5ce7",desc:"平台激励为主，逐步拓展品牌合作和付费内容"}
              ].map((t,i)=>(
                <div key={i} style={{padding:14,background:'#0d0d14',borderRadius:8}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                    <span style={{fontSize:12,fontWeight:600,color:t.color}}>{t.tier}</span>
                    <span style={{fontSize:10,color:'#555',fontFamily:'JetBrains Mono,monospace'}}>{t.count}位</span>
                  </div>
                  <div style={{fontSize:14,fontWeight:700,color:'#fff',fontFamily:'JetBrains Mono,monospace',marginBottom:6}}>{t.range}</div>
                  <p style={{fontSize:10,color:'#555',lineHeight:1.6}}>{t.desc}</p>
                </div>
              ))}
            </div>
            <p style={{fontSize:9,color:'#333',marginTop:10,textAlign:'right'}}>* 收入为基于公开数据和行业案例的综合估算，仅供参考</p>
          </Card>
        </section>

        {/* ═══ 02 内容风格 ═══ */}
        <section id="style" style={{marginBottom:56}}>
          <SectionTitle num="02" title="内容风格画像" subtitle="10大风格流派及其代表博主"/>

          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
            {STYLE_GROUPS.map((g,i)=>(
              <Card key={i} pad={18}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>
                  <div>
                    <span style={{fontSize:13,fontWeight:600,color:g.color}}>{g.name}</span>
                    <span style={{fontSize:10,color:'#444',marginLeft:8}}>{g.members.length}位</span>
                  </div>
                </div>
                <p style={{fontSize:11,color:'#666',lineHeight:1.6,marginBottom:8}}>{g.desc}</p>
                <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
                  {g.members.map((m,mi)=>(
                    <span key={mi} style={{fontSize:10,color:g.color,background:`${g.color}10`,padding:'2px 8px',borderRadius:4,border:`1px solid ${g.color}20`}}>{m}</span>
                  ))}
                </div>
              </Card>
            ))}
          </div>
        </section>

        {/* ═══ 03 影响力 ═══ */}
        <section id="influence" style={{marginBottom:56}}>
          <SectionTitle num="03" title="三维影响力评估" subtitle="覆盖广度 × 影响深度 × 互动质量"/>

          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:20,marginBottom:20}}>
            {Object.entries(INFLUENCE_METRICS).map(([key,metric])=>(
              <Card key={key}>
                <h3 style={{fontSize:13,fontWeight:600,color:'#ccc',marginBottom:6}}>{metric.label}</h3>
                <p style={{fontSize:11,color:'#555',marginBottom:14,lineHeight:1.6}}>{metric.desc}</p>
                <div style={{fontSize:10,color:'#444',marginBottom:6}}>TOP 5 博主</div>
                {metric.top.map((name,i)=>(
                  <div key={i} style={{display:'flex',alignItems:'center',gap:8,marginBottom:5}}>
                    <span style={{width:16,fontSize:10,color:'#333',fontFamily:'JetBrains Mono,monospace',textAlign:'center'}}>{i+1}</span>
                    <div style={{flex:1,height:6,background:'rgba(255,255,255,0.03)',borderRadius:3,overflow:'hidden'}}>
                      <div style={{width:`${100-i*15}%`,height:'100%',background:['#00d4aa','#ffd93d','#ff6b6b','#6c5ce7','#0984e3'][i],borderRadius:3,opacity:0.6}}/>
                    </div>
                    <span style={{fontSize:11,color:'#aaa',minWidth:90}}>{name}</span>
                  </div>
                ))}
              </Card>
            ))}
          </div>

          {/* 影响力矩阵 */}
          <Card pad={20}>
            <h3 style={{fontSize:13,fontWeight:600,color:'#ccc',marginBottom:16}}>影响力矩阵：广度 vs 深度</h3>
            <div style={{position:'relative',height:320,background:'#0d0d14',borderRadius:8}}>
              {/* Axes */}
              <div style={{position:'absolute',bottom:30,left:60,right:20,height:1,background:'#1a1a25'}}/>
              <div style={{position:'absolute',top:10,bottom:30,left:60,width:1,background:'#1a1a25'}}/>
              <span style={{position:'absolute',bottom:8,left:'50%',transform:'translateX(-50%)',fontSize:10,color:'#444'}}>覆盖广度 →</span>
              <span style={{position:'absolute',top:'50%',left:8,transform:'rotate(-90deg) translateX(-50%)',fontSize:10,color:'#444',whiteSpace:'nowrap'}}>影响深度 →</span>

              {/* Quadrant labels */}
              <span style={{position:'absolute',top:16,right:24,fontSize:9,color:'#333'}}>高广度·高深度</span>
              <span style={{position:'absolute',top:16,left:64,fontSize:9,color:'#333'}}>低广度·高深度</span>
              <span style={{position:'absolute',bottom:40,right:24,fontSize:9,color:'#333'}}>高广度·低深度</span>
              <span style={{position:'absolute',bottom:40,left:64,fontSize:9,color:'#333'}}>低广度·低深度</span>

              {/* Dots */}
              {BLOGGERS.map(b=>{
                const breadthScore=b.platform.split('+').length>=3?0.9:b.platform.split('+').length===2?0.6:0.3;
                const depthScore=b.fans>=150?0.95:b.fans>=100?0.85:b.fans>=70?0.7:b.fans>=50?0.55:0.4;
                const x=60+breadthScore*(1100-80);
                const y=280-depthScore*240;
                const size=b.fans>=100?10:b.fans>=50?8:6;
                return(
                  <div key={b.rank} title={`${b.name} (${b.fans}万粉)`} style={{
                    position:'absolute',left:x,top:y,
                    width:size,height:size,borderRadius:'50%',
                    background:b.color,opacity:0.8,
                    transform:'translate(-50%,-50%)',
                    cursor:'pointer',transition:'all 0.2s',
                  }}/>
                );
              })}
            </div>
            <div style={{display:'flex',gap:16,marginTop:10,flexWrap:'wrap'}}>
              <span style={{fontSize:9,color:'#444'}}>圆点大小 = 粉丝量级</span>
              <span style={{fontSize:9,color:'#444'}}>位置 = 广度×深度综合评估</span>
              <span style={{fontSize:9,color:'#444'}}>悬停查看博主名称</span>
            </div>
          </Card>
        </section>

        {/* ═══ 04 博主详情 ═══ */}
        <section id="detail" style={{marginBottom:56}}>
          <SectionTitle num="04" title="博主完整画像" subtitle="点击展开查看盈利结构、风格描述和影响力评估"/>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {BLOGGERS.map(b=><BloggerDetail key={b.rank} b={b} expanded={expanded===b.rank} onToggle={()=>setExpanded(expanded===b.rank?null:b.rank)}/>)}
          </div>
        </section>

        {/* ═══ 05 数据来源 ═══ */}
        <section id="source" style={{marginBottom:40}}>
          <SectionTitle num="05" title="数据来源与免责声明"/>
          <Card>
            <div style={{display:'flex',flexDirection:'column',gap:12}}>
              {[
                {name:"AIGCRank 2025年度AI博主榜单",url:"juejin.cn/post/7591993600390529075",type:"行业数据平台"},
                {name:"B站2025年Q1/Q2财报",url:"toutiao.com/group/7506700035820634650",type:"官方财报"},
                {name:"B站2025百大UP主榜单",url:"baike.com/wiki/2025年B站百大UP主",type:"官方评选"},
                {name:"36氪/头条AI博主推荐报道",url:"toutiao.com/group/7633353017865142794",type:"媒体报道"},
                {name:"飞书·国内优秀AI博主大盘点",url:"feishu.cn/v/wiki/Ky7xw3GyKiRSJtkKrHmcO4kGnGc",type:"社区整理"},
                {name:"B站UP主商业变现路径分析",url:"renrendoc.com/paper/493403817",type:"行业研究"},
                {name:"AI知识付费市场案例（粥左罗/洪灏等）",url:"toutiao.com/group/7489725375342264844",type:"市场案例"}
              ].map((s,i)=>(
                <div key={i} style={{padding:12,background:'#0d0d14',borderRadius:6,border:'1px solid #1a1a25'}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:3}}>
                    <span style={{fontSize:12,fontWeight:600,color:'#ccc'}}>{s.name}</span>
                    <span style={{fontSize:9,color:'#00d4aa',background:'#00d4aa12',padding:'1px 6px',borderRadius:3}}>{s.type}</span>
                  </div>
                  <span style={{fontSize:10,color:'#333',fontFamily:'JetBrains Mono,monospace'}}>{s.url}</span>
                </div>
              ))}
            </div>
            <div style={{marginTop:14,padding:12,background:'#ffd93d06',borderRadius:6,border:'1px solid #ffd93d15'}}>
              <p style={{fontSize:11,color:'#666',lineHeight:1.7}}>
                <strong style={{color:'#ffd93d'}}>免责声明：</strong>
                本报告中粉丝数、播放量、收入估算等数据来源于公开渠道和行业报告，可能存在时效性偏差。收入数据为基于行业案例的综合估算，不代表博主实际收入。排名综合考量了AIGCRank榜单排名、B站公开数据、行业影响力和内容质量等多维度指标。数据采集时间截至2026年4月，仅供参考。
              </p>
            </div>
          </Card>
        </section>
      </main>

      <footer style={{borderTop:'1px solid #1a1a25',padding:'28px 40px',textAlign:'center'}}>
        <p style={{fontSize:10,color:'#333',fontFamily:'JetBrains Mono,monospace'}}>B站AI领域Top20博主 · 盈利模式与影响力深度分析 · 数据截至2026年4月</p>
      </footer>
    </div>
  );
