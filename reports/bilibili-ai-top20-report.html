function BarChart({ data, maxValue, barColor, label, unit, height }) {
  const chartHeight = height || 200;
  return (
    <div style={{ display: 'flex', alignItems: 'flex-end', gap: 3, height: chartHeight, padding: '0 4px' }}>
      {data.map((d, i) => {
        const h = maxValue > 0 ? (d.value / maxValue) * (chartHeight - 24) : 0;
        return (
          <div key={i} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
            <span style={{ fontSize: 10, color: '#888', fontFamily: 'JetBrains Mono, monospace' }}>
              {d.value}{unit || ''}
            </span>
            <div style={{
              width: '100%',
              maxWidth: 32,
              height: Math.max(2, h),
              background: d.color || barColor || '#00d4aa',
              borderRadius: '3px 3px 0 0',
              transition: 'height 0.6s cubic-bezier(0.16, 1, 0.3, 1)',
              opacity: 0.85,
            }} />
            <span style={{
              fontSize: 9,
              color: '#666',
              textAlign: 'center',
              lineHeight: 1.2,
              maxWidth: 40,
              overflow: 'hidden',
              textOverflow: 'ellipsis',
              whiteSpace: 'nowrap',
            }}>
              {d.label}
            </span>
          </div>
        );
      })}
    </div>
  );
}

function HorizontalBar({ label, value, max, color, rank }) {
  const pct = max > 0 ? (value / max) * 100 : 0;
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 6 }}>
      <span style={{
        width: 24, textAlign: 'center', fontSize: 12,
        fontFamily: 'JetBrains Mono, monospace', color: '#555',
      }}>
        {rank}
      </span>
      <span style={{
        width: 120, fontSize: 13, color: '#ccc',
        overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
        fontWeight: 500,
      }}>
        {label}
      </span>
      <div style={{ flex: 1, height: 22, background: 'rgba(255,255,255,0.04)', borderRadius: 4, overflow: 'hidden' }}>
        <div style={{
          width: `${pct}%`,
          height: '100%',
          background: `linear-gradient(90deg, ${color}cc, ${color})`,
          borderRadius: 4,
          transition: 'width 0.8s cubic-bezier(0.16, 1, 0.3, 1)',
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'flex-end',
          paddingRight: 8,
        }}>
          <span style={{ fontSize: 11, color: '#fff', fontFamily: 'JetBrains Mono, monospace', fontWeight: 600 }}>
            {value}万

function DonutChart({ data, size, centerLabel }) {
  const total = data.reduce((s, d) => s + d.value, 0);
  let cumulative = 0;
  const radius = (size - 12) / 2;
  const cx = size / 2, cy = size / 2;
  const strokeWidth = 18;

  const arcs = data.map(d => {
    const pct = d.value / total;
    const startAngle = cumulative * 2 * Math.PI - Math.PI / 2;
    cumulative += pct;
    const endAngle = cumulative * 2 * Math.PI - Math.PI / 2;
    const largeArc = pct > 0.5 ? 1 : 0;
    const x1 = cx + radius * Math.cos(startAngle);
    const y1 = cy + radius * Math.sin(startAngle);
    const x2 = cx + radius * Math.cos(endAngle);
    const y2 = cy + radius * Math.sin(endAngle);
    return { ...d, x1, y1, x2, y2, largeArc, pct };
  });

  return (
    <div style={{ position: 'relative', width: size, height: size }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        {arcs.map((arc, i) => (
          <path key={i}
            d={`M ${arc.x1} ${arc.y1} A ${radius} ${radius} 0 ${arc.largeArc} 1 ${arc.x2} ${arc.y2}`}
            fill="none" stroke={arc.color} strokeWidth={strokeWidth}
            strokeLinecap="butt" opacity={0.85}
          />
        ))}
      </svg>
      <div style={{
        position: 'absolute', top: '50%', left: '50%',
        transform: 'translate(-50%, -50%)', textAlign: 'center',
      }}>
        <div style={{ fontSize: 22, fontWeight: 700, color: '#fff', fontFamily: 'JetBrains Mono, monospace' }}>
          {centerLabel}
        </div>
        <div style={{ fontSize: 10, color: '#666' }}>TOP 20</div>
      </div>
    </div>
  );
}
